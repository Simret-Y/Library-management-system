
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="themeToggle">
            <input type="checkbox" id="themeToggle">
            <div class="slider">
                <span class="emoji sun">☀️</span>
                <span class="emoji moon">🌙</span>
            </div>
        </label>
    </div>

    <div class="container">
        <header class="header">
            <h1>📚 Library Management System</h1>
        </header>

        <div class="dashboard">
            <section class="section">
                <div class="section-header">
                    <h2>Book Management</h2>
                    <div class="section-badge">Books</div>
                </div>
                
                <div class="form-group">
                    <div class="input-grid">
                        <input id="bookId" placeholder="Book ID">
                        <input id="bookTitle" placeholder="Title">
                        <input id="bookAuthor" placeholder="Author">
                        <input id="bookQuantity" type="number" placeholder="Quantity" min="1">
                    </div>
                    
                    <div class="button-group">
                        <button onclick="addBook()" class="btn btn-primary">
                            <span class="btn-icon">➕</span>
                            Add Book
                        </button>
                        <button onclick="displayBooks()" class="btn btn-secondary">
                            <span class="btn-icon">📖</span>
                            View All
                        </button>
                        <button onclick="countBooks()" class="btn btn-secondary">
                            <span class="btn-icon">📊</span>
                            Count Books
                        </button>
                    </div>
                    
                    <div class="action-row">
                        <div class="search-box">
                            <input id="searchBookKeyword" placeholder="Search books...">
                            <button onclick="searchBooks()" class="btn btn-accent">
                                <span class="btn-icon">🔍</span>
                                Search
                            </button>
                        </div>
                        
                        <div class="sort-box">
                            <select id="sortCriterion">
                                <option value="">Sort By</option>
                                <option value="title">Title</option>
                                <option value="author">Author</option>
                                <option value="id">ID</option>
                            </select>
                            <button onclick="sortBooks()" class="btn btn-accent">
                                <span class="btn-icon">📈</span>
                                Sort
                            </button>
                        </div>
                    </div>
                    
                    <div id="bookList" class="data-list"></div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Member Management</h2>
                    <div class="section-badge">Members</div>
                </div>
                
                <div class="form-group">
                    <div class="input-grid">
                        <input id="memberId" placeholder="Member ID">
                        <input id="memberName" placeholder="Name">
                        <input id="memberContact" placeholder="Contact">
                    </div>
                    
                    <div class="button-group">
                        <button onclick="addMember()" class="btn btn-primary">
                            <span class="btn-icon">➕</span>
                            Add Member
                        </button>
                        <button onclick="displayMembers()" class="btn btn-secondary">
                            <span class="btn-icon">👥</span>
                            View All
                        </button>
                    </div>
                    
                    <div class="action-row">
                        <div class="search-box">
                            <input id="searchMemberKeyword" placeholder="Search members...">
                            <button onclick="searchMembers()" class="btn btn-accent">
                                <span class="btn-icon">🔍</span>
                                Search
                            </button>
                        </div>
                        
                        <div class="sort-box">
                            <select id="memberSortAttribute">
                                <option value="name">Name</option>
                                <option value="id">ID</option>
                                <option value="contact">Contact</option>
                            </select>
                            <button id="sortMembersBtn" class="btn btn-accent">
                                <span class="btn-icon">📈</span>
                                Sort
                            </button>
                        </div>
                    </div>
                    
                    <div id="memberList" class="data-list"></div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Transactions</h2>
                    <div class="section-badge">Borrow/Return</div>
                </div>
                
                <div class="form-group">
                    <div class="input-grid">
                        <input id="borrowMemberId" placeholder="Member ID">
                        <input id="borrowBookId" placeholder="Book ID">
                    </div>
                    
                    <div class="button-group centered">
                        <button onclick="borrowBook()" class="btn btn-success">
                            <span class="btn-icon">📚</span>
                            Borrow Book
                        </button>
                        <button onclick="returnBook()" class="btn btn-danger">
                            <span class="btn-icon">↩️</span>
                            Return Book
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
